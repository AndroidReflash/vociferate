[package]
name = "vociferate_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "vociferate_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
minimp3 = "0.5.1"
hound = "3.5"
uniffi = { version = "0.28", features = ["cli"] }
tokio = { version = "1.43", features = ["full"] }
quinn = { version = "0.11", features = ["rustls-ring"] }
rustls = { version = "0.23", features = ["ring", "std", "tls12"] }
quinn-proto = "0.11"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
crossbeam-channel = "0.5"
arc-swap = "1"
# Audio
cpal = "0.15"
opus = "0.4"
rubato = "0.16"
rtrb = "0.4"
# Discovery
mdns-sd = "0.11"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.5"
bincode = "1.3"
# Certificates
rcgen = "0.11"
time = "0.3"
# Utilities
thiserror = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
dashmap = "6.1"
rand = "0.8"
dirs = "5.0"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "android")'.dependencies]
cpal = { version = "0.15", features = ["oboe-shared-stdcxx"] }
jni = "0.21"
ndk-context = "0.1"
android_logger = "0.14"

[dev-dependencies]
env_logger = "0.11"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
